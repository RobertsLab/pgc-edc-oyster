<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oyster scRNA‑seq Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.34.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
  <header class="site-header">
    <h1>Oyster scRNA‑seq Explorer</h1>
    <nav>
      <span class="nav-label">Navigation</span>
      <a href="index.html" class="nav-link">Explorer</a>
      <a href="figures.html" class="nav-link">Figures</a>
      <a href="https://github.com/RobertsLab/pgc-edc-oyster" target="_blank" rel="noopener" class="nav-link nav-icon" aria-label="GitHub Repository" title="GitHub Repository">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" focusable="false"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.19 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
      </a>
    </nav>
  </header>

  <main class="container">
    <section class="controls">
      <div class="control">
        <label for="datasetSelect">Dataset</label>
        <select id="datasetSelect"></select>
      </div>

      <div class="control">
        <label for="layoutSelect">Embedding</label>
        <select id="layoutSelect">
          <option value="umap">UMAP</option>
          <option value="tsne">t‑SNE</option>
        </select>
      </div>

      <div class="control">
        <label for="clusterSelect">Clusters</label>
        <select id="clusterSelect"></select>
      </div>

      <div class="control search">
        <label for="geneInput">Gene (feature) search</label>
        <input id="geneInput" type="text" placeholder="e.g. ACTB" autocomplete="off">
        <button id="geneShowBtn" title="Plot expression if available">Show</button>
        <button id="geneInfoBtn" title="Show annotations for this gene">Info</button>
      </div>
    </section>

    <section class="plots">
      <div id="scatter" class="plot"></div>
      <div id="legend" class="legend"></div>
    </section>

    <section class="details">
      <div id="info"></div>
    </section>
  </main>

  <footer class="site-footer">
    <span>Built for GitHub Pages. Data from Cell Ranger outputs in this repository.</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
